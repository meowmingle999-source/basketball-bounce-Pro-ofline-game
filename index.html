<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="robots" content="index,follow">
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="viewport" content="initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,width=device-width,minimal-ui">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="HandheldFriendly" content="true">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<title>Slam Dunk Basketball</title>
		<style>
			* {
				padding: 0;
				margin: 0;
			}

			html, body {
				width: 100%;
				height: 100%;
				background-color: #333333;
				overflow: hidden;
			}

			#gameContainer {
				display: flex;
				width: 100%;
				height: 100%;
			}

			#game-iframe {
				width: 100%;
				height: 100%;
				border: none;
				background-color: #333333;
			}
		</style>
	</head>
	<body>
		<div id="gameContainer">
			<iframe id="game-iframe" src="" webkit-playsinline="true" scrolling="no" frameborder="0" allow="autoplay"></iframe>
		</div>

		<script>
		(function(){
			const packageId = "slam-dunk-basketball";
			let affiliateId = "A1000-10";
			const iframe = document.querySelector("#game-iframe");
			if (affiliateId == "A1000-10") {
				affiliateId += (Math.random() >= 0.5) ? "A" : "B";
			}
			if(iframe) {
				iframe.setAttribute("src", 'https://play.famobi.com/' + packageId + "/" + affiliateId);
			}
		})();
		</script>
	</body>
  </html>
